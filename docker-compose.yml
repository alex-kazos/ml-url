# Local monitoring stack: the inference API, Prometheus and Grafana.
#
#   docker compose up --build
#
#   API         http://localhost:8000/docs
#   Prometheus  http://localhost:9090   (Alerts tab shows the rules from alerts.yml)
#   Grafana     http://localhost:3000   (dashboard "ml-url overview", login admin/admin)
#
# Then generate traffic:  python monitoring/simulate_traffic.py --minutes 10
services:
  api:
    build: .
    environment:
      API_MODEL_NAME: ${API_MODEL_NAME:-XGBoost}
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ml-url.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
