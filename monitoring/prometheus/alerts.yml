# Alert rules for ml-url. Unit tests: promtool test rules alerts_test.yml
groups:
  - name: ml-url-service
    rules:
      - alert: MlUrlApiDown
        expr: up{job="ml-url-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: The ml-url API is down or Prometheus cannot scrape it.

      - alert: MlUrlSlowPredictions
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(mlurl_prediction_latency_seconds_bucket[5m])))
            > 0.5
        for: 10m
        labels:
          severity: page
        annotations:
          summary: p95 prediction latency has been above 500 ms for 10 minutes.

      - alert: MlUrlPredictionErrors
        expr: sum(increase(mlurl_prediction_errors_total[10m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: Some /predict requests are failing.

  - name: ml-url-model
    rules:
      - alert: MlUrlPhishingShareSpike
        expr: |
          (
            sum(rate(mlurl_predictions_total{verdict="phishing"}[15m]))
              / sum(rate(mlurl_predictions_total[15m]))
          )
          > 2 * (
            sum(rate(mlurl_predictions_total{verdict="phishing"}[6h]))
              / sum(rate(mlurl_predictions_total[6h]))
          )
          and sum(increase(mlurl_predictions_total[15m])) > 20
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: The share of phishing verdicts doubled versus the 6-hour baseline.
          description: Either an attack wave or drift. Check the input panels before retraining.

      - alert: MlUrlLookalikeOverridesHigh
        expr: |
          sum(rate(mlurl_lookalike_overrides_total[1h])) / sum(rate(mlurl_predictions_total[1h]))
            > 0.2
          and sum(increase(mlurl_predictions_total[1h])) > 20
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: The lookalike rule overrides the model on more than 20% of requests.
          description: The model is missing impersonation patterns that the rule catches.

      - alert: MlUrlInputFormatShift
        expr: |
          abs(
            sum(rate(mlurl_input_urls_total{has_scheme="true"}[1h]))
              / sum(rate(mlurl_input_urls_total[1h]))
            - sum(rate(mlurl_input_urls_total{has_scheme="true"}[7d]))
              / sum(rate(mlurl_input_urls_total[7d]))
          ) > 0.3
          and sum(increase(mlurl_input_urls_total[1h])) > 20
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: The share of URLs typed with http(s):// moved by more than 30 points.
          description: >-
            The model scores the same URL differently with and without a scheme,
            so a shift in how people paste URLs changes its behaviour.
